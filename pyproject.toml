# Metadata only. This repository is distributed as an Agent Skill, not as an
# installable Python distribution:
#
#   * There is no importable package here. `scripts/` is a plain directory, not a
#     package, and `scripts/scaffold_rules.py` is invoked in place.
#   * The runtime resolves its templates from the sibling `assets/templates/`
#     directory, so a wheel-installed copy could not run `init` even if it built.
#
# Earlier revisions declared a `project-architect` console script here, but
# `pip install .` never worked (setuptools cannot infer packages from this flat
# layout) and could not have worked. Install the skill instead:
#
#   npx skills add jnnmia/project-architect
#
# The `[project]` table below is kept for tooling that reads project metadata.

[project]
name = "project-architect"
version = "1.1.0"
description = "Project architecture, non-negotiable constitution scaffolding, and multi-agent rule synchronization tool."
readme = "README.md"
authors = [
    { name = "jnnmia" }
]
requires-python = ">=3.8"
keywords = ["architecture", "constitution", "rules", "cursor", "claude", "agents", "scaffolding"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
