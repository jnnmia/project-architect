[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-architect"
version = "1.0.0"
description = "Project architecture, non-negotiable constitution scaffolding, and multi-agent rule synchronization tool."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "jnnmia" }
]
requires-python = ">=3.8"
keywords = ["architecture", "constitution", "rules", "cursor", "claude", "agents", "scaffolding"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
project-architect = "scripts.scaffold_rules:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
